name: Refresh session list

on:
  schedule:
    - cron: '20 20 * * *'   # daily, ~06:20-07:20 Sydney
  # Refresh the club bookings as soon as a booking run finishes (success or failure),
  # so the dashboard shows the latest state without pressing "Refresh from club site".
  workflow_run:
    workflows: ["Book selected sessions"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ng-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment: club   # secrets live in this environment, restricted to the main branch
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out the data branch into data/
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: data
          path: data

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape tennis socials and group exercise sessions
        env:
          NG_MEMBER_NUMBER: ${{ secrets.NGMEMBERNUMBER }}
          NG_PASSWORD: ${{ secrets.NGPASSWORD }}
        run: python scripts/scrape.py

      - name: Save results
        run: |
          git -C data config user.name "ngbooker[bot]"
          git -C data config user.email "ngbooker@users.noreply.github.com"
          git -C data add sessions.json my-bookings.json members.json
          git -C data diff --cached --quiet && exit 0
          git -C data commit -m "Refresh sessions"
          # The booking run pushes to the same branch (different files), so retry if the push races.
          for attempt in 1 2 3 4 5; do
            git -C data pull --rebase origin data && git -C data push origin HEAD:data && exit 0
            echo "push attempt $attempt failed; retrying..."
            sleep $((attempt * 3))
          done
          exit 1
