name: Peek court availability

# Manual, read-only: lists court slots (including gold-only dates). Never books or writes data.
on:
  workflow_dispatch:
    inputs:
      all_days:
        description: Check every listed date, not just gold-only dates and Sundays
        type: boolean
        default: false
      duration:
        description: Court slot length in minutes
        type: choice
        options: ['30', '60', '90']
        default: '30'

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    environment: club   # secrets live in this environment, restricted to the main branch
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Read court availability
        env:
          NG_MEMBER_NUMBER: ${{ secrets.NGMEMBERNUMBER }}
          NG_PASSWORD: ${{ secrets.NGPASSWORD }}
          ALL_DAYS: ${{ inputs.all_days }}
          DURATION: ${{ inputs.duration }}
        run: |
          args="--duration $DURATION"
          [ "$ALL_DAYS" = "true" ] && args="$args --all-days"
          python scripts/peek_courts.py $args
